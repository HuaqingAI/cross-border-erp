services:
  nginx:
    ports:
      - "80:80"

  api:
    ports:
      - "8000:8000"
    volumes:
      - ./erp-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
